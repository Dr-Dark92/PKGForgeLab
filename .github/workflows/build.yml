name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore PKGForgeLab.sln
      - run: dotnet build PKGForgeLab.sln -c Release --no-restore -warnaserror
      - run: dotnet publish src/PKGForgeLab/PKGForgeLab.csproj -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: PKGForgeLab-win-x64
          path: publish
